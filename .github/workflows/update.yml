name: Update helix
on:
  schedule:
    # Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-helix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update helix input
        run: |
          nix flake update helix
          echo "REV=$(nix flake metadata --json | jq -r '.locks.nodes.helix.locked.rev')" >> "$GITHUB_ENV"

      # Push build results to the mtul cachix cache so your machines only
      # download. Set the CACHIX_AUTH_TOKEN repository secret to enable.
      - name: Build and push to cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v16
        with:
          name: mtul
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          extraPullNames: mtul
          nixBuildArgs: .#helix --accept-flake-config -L

      - name: Build (no cache push)
        if: env.CACHIX_AUTH_TOKEN == ''
        run: nix build .#helix --accept-flake-config -L

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/helix
          delete-branch: true
          title: "Update helix to ${{ env.REV }}"
          body: |
            Automated update of the `helix` flake input.

            New rev: `${{ env.REV }}`
          token: ${{ secrets.GITHUB_TOKEN }}
