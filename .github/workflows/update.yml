name: Update helix
on:
  schedule:
    # Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-helix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update helix, regenerate grammars.json, build
        run: |
          nix flake update helix
          echo "REV=$(nix flake metadata --json | jq -r '.locks.nodes.helix.locked.rev')" >> "$GITHUB_ENV"
          ./update.sh

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/helix
          delete-branch: true
          title: "Update helix to ${{ env.REV }}"
          body: |
            Automated update of the `helix` flake input, `grammars.json` and
            `cargoHash`.

            New rev: `${{ env.REV }}`
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            grammars.json
            unwrapped.nix
