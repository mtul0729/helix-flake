name: Update helix
on:
  schedule:
    # Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-helix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update helix, regenerate grammars.json, build
        run: |
          nix flake update helix
          echo "REV=$(nix eval --raw .#helix-unwrapped.passthru.rev --accept-flake-config)" >> "$GITHUB_ENV"
          ./update.sh

      # Push directly: the build above already validated the new rev and
      # hashes, so a bad rev is stopped here rather than landing on master.
      # (The repo-level "Allow GitHub Actions to create pull requests"
      # toggle is off, so PRs are not available to the bot.)
      - name: Commit and push update
        if: env.CACHIX_AUTH_TOKEN != ''
        run: |
          if git diff --quiet -- grammars.json unwrapped.nix; then
            echo "helix already up to date at ${{ env.REV }}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add grammars.json unwrapped.nix
            git commit -m "Update helix to ${{ env.REV }}"
            git pull --rebase origin master
            git push
          fi
