name: Update helix
on:
  schedule:
    # Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-helix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # Pin to the same Nix the consumers run (see build.yml).
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update helix, regenerate grammars.json, build
        run: |
          nix flake update helix
          echo "REV=$(nix flake metadata --json | jq -r '.locks.nodes.helix.locked.rev')" >> "$GITHUB_ENV"
          ./update.sh

      # Push the build closure (helix, runtime, grammars) to the mtul cachix
      # cache. Requires the CACHIX_AUTH_TOKEN repository secret.
      - name: Push to cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        run: nix run nixpkgs#cachix -- push mtul result

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/helix
          delete-branch: true
          title: "Update helix to ${{ env.REV }}"
          body: |
            Automated update of the `helix` flake input and `grammars.json`.

            New rev: `${{ env.REV }}`
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            flake.lock
            grammars.json
