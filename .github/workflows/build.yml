name: Build helix
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # Pin to the same Nix the consumers run. Nix 2.35 changed
          # structuredAttrs serialization, so derivations built with a newer
          # Nix hash differently and the cachix cache never hits locally.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Builds .#helix, auto-fixing cargoHash if Cargo.lock changed.
      - name: Build
        run: ./build.sh

      # Commit the auto-fixed cargoHash, if any.
      - name: Commit cargoHash fix
        if: env.CARGO_HASH_CHANGED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "cargoHash: auto-update"
          git push

      # Push the full build closure (including build-time deps like the
      # cargo vendor dir), not just the runtime closure of `result`.
      - name: Push to cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        run: nix run nixpkgs#cachix -- push mtul "$(nix eval --raw .#helix.drvPath)"
