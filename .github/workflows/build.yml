name: Build helix
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # Pin to the same Nix the consumers run. Nix 2.35 changed
          # structuredAttrs serialization, so derivations built with a newer
          # Nix hash differently and the cachix cache never hits locally.
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: nix build .#helix --accept-flake-config -L

      # Push the build closure (helix, runtime, grammars) to the mtul cachix
      # cache. Requires the CACHIX_AUTH_TOKEN repository secret.
      - name: Push to cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        run: nix run nixpkgs#cachix -- push mtul result
