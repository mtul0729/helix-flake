name: Build helix
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, system: x86_64-linux }
          - { os: ubuntu-24.04-arm, system: aarch64-linux }
          - { os: macos-14, system: aarch64-darwin }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Evaluate flake
        run: nix flake check --accept-flake-config

      # Builds the matrix system's helix, updating cargoHash via nix-update
      # if Cargo.lock changed.
      - name: Build
        run: ./build.sh ${{ matrix.system }}

      # Only one runner commits the auto-fixed cargoHash, to avoid races.
      - name: Detect cargoHash fix
        id: hash
        if: matrix.system == 'x86_64-linux'
        run: |
          if git diff --quiet -- unwrapped.nix; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit cargoHash fix
        if: matrix.system == 'x86_64-linux' && steps.hash.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "cargoHash: auto-update"
          git pull --rebase origin master
          git push
