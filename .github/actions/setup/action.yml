name: Set up Nix build environment
description: Installs Nix and the cachix daemon; every store path built
  afterwards is pushed to the mtul cache automatically (build-time deps
  included) — no explicit push step anywhere.
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    - uses: cachix/cachix-action@v16
      with:
        name: mtul
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: true
        skipAddingSubstituter: true
